name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests

      - name: Mypy
        run: mypy app

      - name: Pytest
        run: pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend
        run: npm install

      - name: Type check and build
        run: npm run build

  integration:
    name: Docker Compose Durable Runtime smoke test
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-only-secret-key-not-for-production
      BOOTSTRAP_ADMIN_USERNAME: ci-admin
      BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password-123
      BOOTSTRAP_ADMIN_EMAIL: ci-admin@example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose config

      - name: Build and start stack
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: Verify backend dependencies
        run: |
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent --show-error http://localhost:8000/health/live

      - name: Authenticate bootstrap administrator
        run: |
          TOKEN=$(curl --fail --silent --show-error             -H 'Content-Type: application/json'             -d '{"username":"ci-admin","password":"ci-admin-password-123"}'             http://localhost:8000/api/auth/login             | python -c "import json,sys; print(json.load(sys.stdin)['access_token'])")
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Verify seeded Skill registry and safe execution
        run: |
          SKILLS=$(curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             http://localhost:8000/api/skills)

          printf '%s' "$SKILLS" | python -c             "import json,sys; data=json.load(sys.stdin); names={item['name'] for item in data}; assert {'system_echo','math_add','text_stats'} <= names"

          MATH_ID=$(printf '%s' "$SKILLS" | python -c             "import json,sys; data=json.load(sys.stdin); print(next(item['id'] for item in data if item['name']=='math_add'))")

          EXECUTED=$(curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d '{"arguments":{"left":2,"right":3}}'             http://localhost:8000/api/skills/"$MATH_ID"/execute)

          printf '%s' "$EXECUTED" | python -c             "import json,sys; data=json.load(sys.stdin)['result']; assert data['ok'] is True; assert data['output']['result'] == 5.0"

      - name: Verify Agent Skill binding persistence
        run: |
          CREATED=$(curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d '{
              "name":"ci-skill-agent",
              "description":"CI Phase 4 binding test",
              "system_instructions":"Use bound skills when useful.",
              "model_provider":"deepseek",
              "model_name":"deepseek-chat",
              "temperature":0.2,
              "skills":["math_add","text_stats"]
            }'             http://localhost:8000/api/agents)

          AGENT_ID=$(printf '%s' "$CREATED" | python -c             "import json,sys; data=json.load(sys.stdin); assert data['versions'][0]['skills'] == ['math_add','text_stats']; print(data['id'])")

          UPDATED=$(curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d '{
              "system_instructions":"Version two uses only echo.",
              "model_provider":"deepseek",
              "model_name":"deepseek-chat",
              "temperature":0.1,
              "skills":["system_echo"]
            }'             http://localhost:8000/api/agents/"$AGENT_ID"/versions)

          printf '%s' "$UPDATED" | python -c             "import json,sys; data=json.load(sys.stdin); assert len(data['versions']) == 2; assert data['active_version_id'] == data['versions'][1]['id']; assert data['versions'][1]['skills'] == ['system_echo']"

      - name: Resolve runtime Agent
        run: |
          AGENTS=$(curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" http://localhost:8000/api/agents)
          AGENT_ID=$(printf '%s' "$AGENTS" | python -c "import json,sys; data=json.load(sys.stdin); print(next(item['id'] for item in data if item['name']=='ci-skill-agent'))")
          echo "AGENT_ID=$AGENT_ID" >> "$GITHUB_ENV"

      - name: Create durable pending Run
        run: |
          CREATED_RUN=$(curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "{\"agent_id\":\"$AGENT_ID\",\"input\":\"Calculate 2 + 3 using the available capability.\",\"additional_context\":[\"CI durable runtime smoke test\"],\"max_attempts\":2}" http://localhost:8000/api/runs)
          RUN_ID=$(printf '%s' "$CREATED_RUN" | python -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='PENDING'; assert d['attempt']==0; assert d['steps'][0]['step_type']=='INPUT'; assert d['checkpoints'][0]['kind']=='run_created'; print(d['id'])")
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Verify pending Run survives backend restart
        run: |
          docker compose restart backend
          for i in $(seq 1 40); do
            if curl --fail --silent http://localhost:8000/health >/dev/null; then break; fi
            sleep 1
          done
          PERSISTED=$(curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" http://localhost:8000/api/runs/"$RUN_ID")
          printf '%s' "$PERSISTED" | python -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='PENDING'; assert d['checkpoints'][0]['kind']=='run_created'; assert d['steps'][0]['status']=='COMPLETED'"

      - name: Verify durable execution failure semantics
        run: |
          STARTED=$(curl --fail --silent --show-error -X POST -H "Authorization: Bearer $TOKEN" http://localhost:8000/api/runs/"$RUN_ID"/start)
          printf '%s' "$STARTED" | python -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='FAILED'; assert d['attempt']==1; assert d['error_data']['code']=='provider_configuration'; assert any(s['step_type']=='MODEL_CALL' and s['status']=='FAILED' for s in d['steps']); assert d['checkpoints'][-1]['kind']=='failed'"

      - name: Verify persisted SSE events
        run: |
          EVENTS=$(curl --fail --silent --show-error -N -H "Authorization: Bearer $TOKEN" http://localhost:8000/api/runs/"$RUN_ID"/events)
          printf '%s' "$EVENTS" | grep -q "event: run.created"
          printf '%s' "$EVENTS" | grep -q "event: run.running"
          printf '%s' "$EVENTS" | grep -q "event: run.failed"
      - name: Verify frontend
        run: curl --fail --silent --show-error http://localhost:5173/ > /dev/null

      - name: Show service state
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
