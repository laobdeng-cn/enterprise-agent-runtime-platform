name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests

      - name: Mypy
        run: mypy app

      - name: Pytest
        run: pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend
        run: npm install

      - name: Type check and build
        run: npm run build

  integration:
    name: Docker Compose Memory Runtime smoke test
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-only-secret-key-not-for-production
      BOOTSTRAP_ADMIN_USERNAME: ci-admin
      BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password-123
      BOOTSTRAP_ADMIN_EMAIL: ci-admin@example.com
      SANDBOX_TIMEOUT_SECONDS: 2
      DOCKER_API_VERSION: "1.45"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose config

      - name: Build and start stack
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: Verify backend dependencies
        run: |
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent --show-error http://localhost:8000/health/live

      - name: Authenticate bootstrap administrator
        run: |
          TOKEN=$(curl --fail --silent --show-error             -H 'Content-Type: application/json'             -d '{"username":"ci-admin","password":"ci-admin-password-123"}'             http://localhost:8000/api/auth/login             | python -c "import json,sys; print(json.load(sys.stdin)['access_token'])")
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Verify seeded Skill registry
        run: |
          SKILLS=$(curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             http://localhost:8000/api/skills)

          printf '%s' "$SKILLS" | python -c             "import json,sys; data=json.load(sys.stdin); names={item['name'] for item in data}; expected={'system_echo','math_add','text_stats','workspace_list','workspace_read_text','workspace_write_text','artifact_publish','python_execute','memory_search','memory_write'}; assert expected <= names"

          MATH_ID=$(printf '%s' "$SKILLS" | python -c             "import json,sys; data=json.load(sys.stdin); print(next(item['id'] for item in data if item['name']=='math_add'))")

          EXECUTED=$(curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d '{"arguments":{"left":2,"right":3}}'             http://localhost:8000/api/skills/"$MATH_ID"/execute)

          printf '%s' "$EXECUTED" | python -c             "import json,sys; data=json.load(sys.stdin)['result']; assert data['ok'] is True; assert data['output']['result'] == 5.0"

      - name: Create Agent with Workspace Skills
        run: |
          CREATED=$(curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d '{
              "name":"ci-workspace-agent",
              "description":"CI Phase 6 workspace test",
              "system_instructions":"Use Run workspace capabilities when useful.",
              "model_provider":"deepseek",
              "model_name":"deepseek-chat",
              "temperature":0.2,
              "skills":["workspace_list","workspace_read_text","workspace_write_text","artifact_publish","python_execute","memory_search","memory_write"]
            }'             http://localhost:8000/api/agents)

          AGENT_ID=$(printf '%s' "$CREATED" | python -c             "import json,sys; d=json.load(sys.stdin); skills=set(d['versions'][0]['skills']); assert {'artifact_publish','python_execute','workspace_list','workspace_read_text','workspace_write_text','memory_search','memory_write'} <= skills; print(d['id'])")
          echo "AGENT_ID=$AGENT_ID" >> "$GITHUB_ENV"

      - name: Create durable Run and Workspace
        run: |
          RUN_PAYLOAD=$(python -c 'import json,os; print(json.dumps({"agent_id":os.environ["AGENT_ID"],"input":"Prepare a report in the workspace.","additional_context":[],"max_attempts":2}))')
          CREATED_RUN=$(curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$RUN_PAYLOAD" http://localhost:8000/api/runs)

          RUN_ID=$(printf '%s' "$CREATED_RUN" | python -c             "import json,sys; d=json.load(sys.stdin); assert d['status']=='PENDING'; print(d['id'])")
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

          WORKSPACE=$(curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             http://localhost:8000/api/runs/"$RUN_ID"/workspace)

          printf '%s' "$WORKSPACE" | python -c             "import json,sys; d=json.load(sys.stdin); assert d['run_id']; assert d['status']=='active'; assert d['used_bytes']==0; assert d['quota_bytes'] > d['max_file_bytes']"

      - name: Verify workspace text boundary
        run: |
          INPUT=$(curl --fail --silent --show-error             -X PUT             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d '{"path":"input/request.md","content":"Analyze the supplied Run input."}'             http://localhost:8000/api/runs/"$RUN_ID"/workspace/text)

          printf '%s' "$INPUT" | python -c             "import json,sys; d=json.load(sys.stdin); assert d['path']=='input/request.md'; assert d['size_bytes'] > 0; assert len(d['sha256'])==64"

          WORKING=$(curl --fail --silent --show-error             -X PUT             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d '{"path":"working/report.md","content":"# Phase 6 workspace artifact"}'             http://localhost:8000/api/runs/"$RUN_ID"/workspace/text)

          printf '%s' "$WORKING" | python -c             "import json,sys; d=json.load(sys.stdin); assert d['path']=='working/report.md'"

          READ=$(curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             "http://localhost:8000/api/runs/$RUN_ID/workspace/text?path=working%2Freport.md")

          printf '%s' "$READ" | python -c             "import json,sys; d=json.load(sys.stdin); assert d['content']=='# Phase 6 workspace artifact'"

          CODE=$(curl --silent --output /tmp/traversal.json --write-out '%{http_code}'             -H "Authorization: Bearer $TOKEN"             "http://localhost:8000/api/runs/$RUN_ID/workspace/text?path=working%2F..%2Fsecret.txt")
          test "$CODE" = "422"

      - name: Publish and download artifact
        run: |
          ARTIFACT=$(curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d '{"source_path":"working/report.md","display_name":"phase6-report.md","kind":"report"}'             http://localhost:8000/api/runs/"$RUN_ID"/artifacts)

          ARTIFACT_ID=$(printf '%s' "$ARTIFACT" | python -c             "import json,sys; d=json.load(sys.stdin); assert d['display_name']=='phase6-report.md'; assert d['kind']=='report'; assert d['media_type'] in {'text/markdown','text/plain'}; assert len(d['sha256'])==64; print(d['id'])")
          echo "ARTIFACT_ID=$ARTIFACT_ID" >> "$GITHUB_ENV"

          ARTIFACTS=$(curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             http://localhost:8000/api/runs/"$RUN_ID"/artifacts)

          printf '%s' "$ARTIFACTS" | python -c             "import json,sys; d=json.load(sys.stdin); assert len(d)==1; assert d[0]['display_name']=='phase6-report.md'"

          curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             -o /tmp/phase6-report.md             http://localhost:8000/api/runs/"$RUN_ID"/artifacts/"$ARTIFACT_ID"/download
          test "$(cat /tmp/phase6-report.md)" = "# Phase 6 workspace artifact"

      - name: Verify workspace and artifact survive backend restart
        run: |
          docker compose restart backend
          for i in $(seq 1 40); do
            if curl --fail --silent http://localhost:8000/health >/dev/null; then
              break
            fi
            sleep 1
          done

          READ=$(curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             "http://localhost:8000/api/runs/$RUN_ID/workspace/text?path=working%2Freport.md")
          printf '%s' "$READ" | python -c             "import json,sys; assert json.load(sys.stdin)['content']=='# Phase 6 workspace artifact'"

          curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             -o /tmp/phase6-report-after-restart.md             http://localhost:8000/api/runs/"$RUN_ID"/artifacts/"$ARTIFACT_ID"/download
          cmp /tmp/phase6-report.md /tmp/phase6-report-after-restart.md

      - name: Verify Sandbox daemon health
        run: |
          SANDBOX_HEALTH=$(curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             http://localhost:8000/api/sandbox/health)
          printf '%s' "$SANDBOX_HEALTH" | python -c             "import json,sys; d=json.load(sys.stdin); assert d['available'] is True; assert d['security']['network_mode']=='none'; assert d['security']['read_only'] is True; assert d['security']['user']=='65534:65534'"

      - name: Create Sandbox Run
        run: |
          RUN_PAYLOAD=$(python -c 'import json,os; print(json.dumps({"agent_id":os.environ["AGENT_ID"],"input":"Analyze input data in the isolated sandbox.","additional_context":[],"max_attempts":2}))')
          CREATED=$(curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d "$RUN_PAYLOAD"             http://localhost:8000/api/runs)
          SANDBOX_RUN_ID=$(printf '%s' "$CREATED" | python -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "SANDBOX_RUN_ID=$SANDBOX_RUN_ID" >> "$GITHUB_ENV"

          curl --fail --silent --show-error             -X PUT             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d '{"path":"input/data.txt","content":"phase seven sandbox"}'             http://localhost:8000/api/runs/"$SANDBOX_RUN_ID"/workspace/text > /dev/null

      - name: Execute isolated Python and publish Artifact
        run: |
          SANDBOX_PAYLOAD=$(python - <<'PY'
          import json
          code = """from pathlib import Path
          text = Path("/workspace/input/data.txt").read_text()
          Path("/workspace/output/result.txt").write_text(text.upper())
          print("sandbox-ok")
          """
          print(json.dumps({"code": code, "publish_artifacts": True}))
          PY
          )

          RESULT=$(curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d "$SANDBOX_PAYLOAD"             http://localhost:8000/api/runs/"$SANDBOX_RUN_ID"/sandbox/python)

          SANDBOX_ARTIFACT_ID=$(printf '%s' "$RESULT" | python -c             "import json,sys; d=json.load(sys.stdin); assert d['status']=='SUCCEEDED'; assert d['exit_code']==0; assert d['timed_out'] is False; assert 'sandbox-ok' in d['stdout']; assert len(d['artifacts'])==1; print(d['artifacts'][0]['artifact_id'])")
          echo "SANDBOX_ARTIFACT_ID=$SANDBOX_ARTIFACT_ID" >> "$GITHUB_ENV"

          curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             -o /tmp/sandbox-result.txt             http://localhost:8000/api/runs/"$SANDBOX_RUN_ID"/artifacts/"$SANDBOX_ARTIFACT_ID"/download
          test "$(cat /tmp/sandbox-result.txt)" = "PHASE SEVEN SANDBOX"

      - name: Verify Sandbox network denial
        run: |
          NETWORK_PAYLOAD=$(python - <<'PY'
          import json
          code = """import socket
          socket.create_connection(("1.1.1.1", 80), timeout=0.5)
          """
          print(json.dumps({"code": code, "publish_artifacts": False}))
          PY
          )

          RESULT=$(curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d "$NETWORK_PAYLOAD"             http://localhost:8000/api/runs/"$SANDBOX_RUN_ID"/sandbox/python)

          printf '%s' "$RESULT" | python -c             "import json,sys; d=json.load(sys.stdin); assert d['status']=='FAILED'; assert d['exit_code'] != 0; assert d['timed_out'] is False"

      - name: Verify Sandbox hard timeout
        run: |
          TIMEOUT_PAYLOAD=$(python - <<'PY'
          import json
          print(json.dumps({"code":"import time\ntime.sleep(5)","publish_artifacts":False}))
          PY
          )

          RESULT=$(curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d "$TIMEOUT_PAYLOAD"             http://localhost:8000/api/runs/"$SANDBOX_RUN_ID"/sandbox/python)

          printf '%s' "$RESULT" | python -c             "import json,sys; d=json.load(sys.stdin); assert d['status']=='TIMED_OUT'; assert d['timed_out'] is True"

      - name: Verify Sandbox persistence and cleanup
        run: |
          RUN=$(curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             http://localhost:8000/api/runs/"$SANDBOX_RUN_ID")
          printf '%s' "$RUN" | python -c             "import json,sys; d=json.load(sys.stdin); steps=[s for s in d['steps'] if s['step_type']=='SANDBOX_EXECUTION']; assert len(steps)==3; assert steps[0]['status']=='COMPLETED'; assert steps[1]['status']=='FAILED'; assert steps[2]['status']=='FAILED'"

          docker compose exec -T docker sh -c             'test -z "$(docker ps -aq --filter label=earp.sandbox=true)"'

      - name: Verify scoped durable Memory CRUD and search
        run: |
          USER_MEMORY=$(curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d '{"memory_type":"LONG_TERM","scope":"USER","content":"Prepare concise Markdown reports for enterprise analysis.","importance":0.85,"metadata":{"source":"ci"}}'             http://localhost:8000/api/memories)

          USER_MEMORY_ID=$(printf '%s' "$USER_MEMORY" | python -c             "import json,sys; d=json.load(sys.stdin); assert d['memory_type']=='LONG_TERM'; assert d['scope']=='USER'; assert d['status']=='ACTIVE'; print(d['id'])")
          echo "USER_MEMORY_ID=$USER_MEMORY_ID" >> "$GITHUB_ENV"

          AGENT_PAYLOAD=$(python -c 'import json,os; print(json.dumps({"memory_type":"SEMANTIC","scope":"AGENT","agent_id":os.environ["AGENT_ID"],"content":"This Agent should use concise report structure for analysis tasks.","importance":0.9}))')
          AGENT_MEMORY=$(curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d "$AGENT_PAYLOAD"             http://localhost:8000/api/memories)

          printf '%s' "$AGENT_MEMORY" | python -c             "import json,sys,os; d=json.load(sys.stdin); assert d['scope']=='AGENT'; assert d['agent_id']==os.environ['AGENT_ID']"

          RUN_PAYLOAD=$(python -c 'import json,os; print(json.dumps({"memory_type":"TASK","scope":"RUN","run_id":os.environ["RUN_ID"],"content":"Prepare the current report in concise Markdown format.","importance":1.0}))')
          RUN_MEMORY=$(curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d "$RUN_PAYLOAD"             http://localhost:8000/api/memories)

          RUN_MEMORY_ID=$(printf '%s' "$RUN_MEMORY" | python -c             "import json,sys,os; d=json.load(sys.stdin); assert d['scope']=='RUN'; assert d['run_id']==os.environ['RUN_ID']; print(d['id'])")
          echo "RUN_MEMORY_ID=$RUN_MEMORY_ID" >> "$GITHUB_ENV"

          SEARCH=$(curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             "http://localhost:8000/api/memories/search?q=prepare%20report&run_id=$RUN_ID&limit=10")

          printf '%s' "$SEARCH" | python -c             "import json,sys,os; d=json.load(sys.stdin); ids={x['id'] for x in d}; assert os.environ['USER_MEMORY_ID'] in ids; assert os.environ['RUN_MEMORY_ID'] in ids; assert all(x['status']=='ACTIVE' for x in d); assert all('score' in x for x in d)"

      - name: Verify Memory deduplication and soft delete
        run: |
          DUPLICATE=$(curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d '{"memory_type":"LONG_TERM","scope":"USER","content":"Prepare concise Markdown reports for enterprise analysis.","importance":0.95,"metadata":{"dedup":"verified"}}'             http://localhost:8000/api/memories)

          printf '%s' "$DUPLICATE" | python -c             "import json,sys,os; d=json.load(sys.stdin); assert d['id']==os.environ['USER_MEMORY_ID']; assert d['importance']==0.95; assert d['metadata']['dedup']=='verified'"

          DELETED=$(curl --fail --silent --show-error             -X DELETE             -H "Authorization: Bearer $TOKEN"             http://localhost:8000/api/memories/"$USER_MEMORY_ID")

          printf '%s' "$DELETED" | python -c             "import json,sys; assert json.load(sys.stdin)['status']=='DELETED'"

          ACTIVE=$(curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             http://localhost:8000/api/memories)
          printf '%s' "$ACTIVE" | python -c             "import json,sys,os; d=json.load(sys.stdin); assert os.environ['USER_MEMORY_ID'] not in {x['id'] for x in d}"

      - name: Verify Runtime injects relevant Memory before model call
        run: |
          STARTED=$(curl --fail --silent --show-error             -X POST             -H "Authorization: Bearer $TOKEN"             http://localhost:8000/api/runs/"$RUN_ID"/start)

          printf '%s' "$STARTED" | python -c             "import json,sys,os; d=json.load(sys.stdin); assert d['status']=='FAILED'; assert d['attempt']==1; assert d['error_data']['code']=='provider_configuration'; steps=[s for s in d['steps'] if s['step_type']=='MODEL_CALL']; assert len(steps)==1; data=steps[0]['input_data']; assert data['memory_count'] >= 1; assert os.environ['RUN_MEMORY_ID'] in data['memory_ids']"

      - name: Verify durable execution failure semantics
        run: |
          FAILURE_PAYLOAD=$(python -c 'import json,os; print(json.dumps({"agent_id":os.environ["AGENT_ID"],"input":"Durable failure regression check.","additional_context":[],"max_attempts":2}))')
          FAILURE_RUN=$(curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$FAILURE_PAYLOAD" http://localhost:8000/api/runs)
          FAILURE_RUN_ID=$(printf '%s' "$FAILURE_RUN" | python -c "import json,sys; print(json.load(sys.stdin)['id'])")
          STARTED=$(curl --fail --silent --show-error             -X POST             -H "Authorization: Bearer $TOKEN"             http://localhost:8000/api/runs/"$FAILURE_RUN_ID"/start)

          printf '%s' "$STARTED" | python -c             "import json,sys; d=json.load(sys.stdin); assert d['status']=='FAILED'; assert d['attempt']==1; assert d['error_data']['code']=='provider_configuration'; assert any(s['step_type']=='MODEL_CALL' and s['status']=='FAILED' for s in d['steps'])"

      - name: Verify persisted SSE events
        run: |
          EVENTS=$(curl --fail --silent --show-error -N             -H "Authorization: Bearer $TOKEN"             http://localhost:8000/api/runs/"$RUN_ID"/events)
          printf '%s' "$EVENTS" | grep -q "event: run.created"
          printf '%s' "$EVENTS" | grep -q "event: run.running"
          printf '%s' "$EVENTS" | grep -q "event: run.failed"

      - name: Verify frontend
        run: curl --fail --silent --show-error http://localhost:5173/ > /dev/null

      - name: Show service state
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
