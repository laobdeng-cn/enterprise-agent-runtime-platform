name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests

      - name: Mypy
        run: mypy app

      - name: Pytest
        run: pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend
        run: npm install

      - name: Type check and build
        run: npm run build

  integration:
    name: Docker Compose auth/RBAC smoke test
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-only-secret-key-not-for-production
      BOOTSTRAP_ADMIN_USERNAME: ci-admin
      BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password-123
      BOOTSTRAP_ADMIN_EMAIL: ci-admin@example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose config

      - name: Build and start stack
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: Verify backend dependencies
        run: |
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent --show-error http://localhost:8000/health/live

      - name: Verify authentication and admin RBAC
        run: |
          TOKEN=$(curl --fail --silent --show-error             -H 'Content-Type: application/json'             -d '{"username":"ci-admin","password":"ci-admin-password-123"}'             http://localhost:8000/api/auth/login             | python -c "import json,sys; print(json.load(sys.stdin)['access_token'])")

          curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             http://localhost:8000/api/auth/me

          curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             http://localhost:8000/api/rbac/roles

          curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             http://localhost:8000/api/rbac/permissions

      - name: Verify frontend
        run: curl --fail --silent --show-error http://localhost:5173/ > /dev/null

      - name: Show service state
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
